services:
  - type: web
    name: maintenance-ai-pro
    runtime: docker
    region: virginia
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MAINT_AI_HOST
        value: 0.0.0.0
      - key: MAINT_AI_DB
        value: /app/data/maintenance_ai.db
      - key: MAINT_AI_API_TOKEN
        generateValue: true
  
